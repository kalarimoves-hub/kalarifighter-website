<!doctype html>
<html lang="en-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalari Fighter | Kalaripayattu Classes in Calgary</title>
  <meta name="description" content="Kalaripayattu classes in Calgary with Krishna. Our website is coming soon.">
  <meta name="theme-color" content="#050505">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      background: radial-gradient(ellipse at 50% 40%, #1a1208 0%, #050505 65%) #050505;
      color: #ece8df;
      font-family: "Lato", "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    .logo { display: inline-flex; align-items: center; gap: 4px; line-height: 1; }
    .k {
      font-family: "Cinzel", Georgia, serif;
      font-weight: 700;
      font-style: italic;
      font-size: 104px;
      color: #e3262b;
      text-shadow: 0 0 22px rgba(227, 38, 43, 0.35);
      margin-right: -6px;
    }
    .words { display: inline-flex; flex-direction: column; align-items: center; }
    .kalari { font-family: "Cinzel", Georgia, serif; font-weight: 700; font-size: 64px; color: #c9a24a; }
    .fighter {
      font-family: "Cinzel", Georgia, serif;
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 9px;
      color: #c9a24a;
      border-top: 1px solid #8a6d2c;
      padding-top: 6px;
      margin-top: 4px;
    }
    h1 {
      margin: 22px 0 0;
      font-family: "Lato", "Helvetica Neue", Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 3px;
    }
    p {
      margin: 28px 0 0;
      font-family: "Cinzel", Georgia, serif;
      font-weight: 700;
      font-size: 28px;
      color: #2b8cff;
      letter-spacing: 1px;
    }
    @media (max-width: 480px) {
      .k { font-size: 76px; }
      .kalari { font-size: 46px; }
      .fighter { font-size: 15px; letter-spacing: 7px; }
      h1 { font-size: 14px; letter-spacing: 2px; }
      p { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-label="Kalari Fighter">
      <span class="k" aria-hidden="true">K</span>
      <span class="words" aria-hidden="true"><span class="kalari">Kalari</span><span class="fighter">FIGHTER</span></span>
    </div>
    <h1>Kalaripayattu classes in Calgary</h1>
    <p>Website coming soon</p>
  </main>
</body>
</html>
